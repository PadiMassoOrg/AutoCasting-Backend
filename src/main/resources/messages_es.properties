# Talent Photo Removed Email (admin removed a photo that doesn't meet catalog requirements)
mail.talentPhotoRemoved.subject=Removimos una foto de tu perfil de autocasting
mail.talentPhotoRemoved.title=Hola, {0}
mail.talentPhotoRemoved.intro=Quer\u00EDamos contarte que se ha hecho una peque\u00F1a actualizaci\u00F3n en tu perfil de Autocasting.
mail.talentPhotoRemoved.reason=El sistema detect\u00F3 que la foto de perfil que subiste no cumple con los requisitos de presentaci\u00F3n que se utilizan para las fotos del cat\u00E1logo, por lo que la foto fue removida autom\u00E1ticamente.
mail.talentPhotoRemoved.accountIntact=Tu cuenta sigue intacta y no se elimin\u00F3 ninguna de la informaci\u00F3n de tu perfil. Simplemente, tu perfil permanecer\u00E1 temporalmente no visible en el cat\u00E1logo hasta que subas una foto que cumpla con estos requisitos.
mail.talentPhotoRemoved.tipsTitle=\u00BFQu\u00E9 fotos se usan en la industria?
mail.talentPhotoRemoved.tipsLead=La foto ideal deber\u00EDa tener:
mail.talentPhotoRemoved.tip1=\u2705 Buena iluminaci\u00F3n
mail.talentPhotoRemoved.tip2=\u2705 Encuadre desde el pecho hasta la cabeza, dejando un poco de aire por encima
mail.talentPhotoRemoved.tip3=\u2705 De frente, con el tel\u00E9fono aproximadamente a la altura de los ojos
mail.talentPhotoRemoved.tip4=\u2705 Fondo liso o poco cargado
mail.talentPhotoRemoved.tip5=\u2705 Sin texto, logos o elementos sobre la imagen
mail.talentPhotoRemoved.noProfessional=No necesit\u00E1s contratar a un fot\u00F3grafo profesional. Una foto tomada con cualquier celular puede funcionar perfectamente si cumple con estos requisitos.
mail.talentPhotoRemoved.exampleLead=Abajo te dejamos un ejemplo para que puedas ver f\u00E1cilmente a qu\u00E9 nos referimos:
mail.talentPhotoRemoved.exampleAlt=Ejemplo de foto de perfil
mail.talentPhotoRemoved.purpose=La idea es que tu perfil pueda mostrarte de la forma m\u00E1s clara y profesional posible, y que quienes buscan talentos puedan identificar r\u00E1pidamente tu perfil y tus caracter\u00EDsticas.
mail.talentPhotoRemoved.criteria=Por eso, estos criterios buscan ayudarte a tener mejores oportunidades dentro de la plataforma, no limitar qui\u00E9n puede formar parte de Autocasting.
mail.talentPhotoRemoved.upload=Cuando tengas una nueva foto lista, pod\u00E9s subirla directamente desde tu perfil y se habilitar\u00E1 tu visibilidad en el cat\u00E1logo.
mail.talentPhotoRemoved.button=Subir una nueva foto
mail.talentPhotoRemoved.help=Si ten\u00E9s alguna duda, escribinos y te ayudamos.
