<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="#{mail.talentPhotoRemoved.subject}"></title>
    <style>
        /* Mobile-first */
        .wrap {
            width: 800px;
            max-width: 100%;
            background: #eef0f4;
            border-radius: 12px;
        }

        .card {
            width: 504px;
            max-width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
        }

        .btn {
            display: inline-block;
            background: #6f2df3;
            text-decoration: none;
            font: 700 16px/56px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 0 32px;
            border-radius: 999px;
            min-width: 260px;
            text-align: center;
            max-width: 100%;
        }

        /* Forzar texto blanco del botón en la mayoría de clientes */
        .btn, a.btn, a.btn:link, a.btn:visited, a.btn span {
            color: #ffffff !important;
        }

        .text {
            font: 400 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111827;
        }

        .h1 {
            margin: 0;
            font: 800 24px/1.25 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #0b0b0b;
        }

        .h2 {
            margin: 0;
            font: 700 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #0b0b0b;
        }

        .brand {
            font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #0b0b0b;
            letter-spacing: .2px;
        }

        .tips {
            background: #f5f3ff;
            border-radius: 16px;
        }

        .example-img {
            display: block;
            width: 100%;
            max-width: 200px;
            height: auto;
            border: 0;
            border-radius: 12px;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            .wrap {
                border-radius: 16px !important;
            }

            .card {
                border-radius: 20px !important;
            }

            .btn {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                box-sizing: border-box !important;
                padding: 0 16px !important;
            }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#eef0f4;">
<table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
        <td align="center" style="padding:24px 16px;">
            <!-- Lienzo con máx 800 -->
            <table border="0" cellpadding="0" cellspacing="0" class="wrap" role="presentation">

                <!-- Card (504px) -->
                <tr>
                    <td align="center" style="padding:20px 16px 16px 16px;">
                        <table align="center" border="0" cellpadding="0" cellspacing="0" class="card"
                               role="presentation">

                            <!-- Header: logo + brand -->
                            <tr>
                                <td align="center" style="padding:28px 16px 20px 16px;">
                                    <!-- Logo PNG inline (cid) -->
                                    <img alt="" height="50" src="cid:autocasting-logo"
                                         style="display:block;border:0;outline:0;text-decoration:none;margin:0 auto 8px auto;max-width:100%;height:auto;"
                                         width="50">
                                    <div class="brand" th:text="#{mail.brand.name}"></div>
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:10px 28px 10px 28px;">
                                    <h1 class="h1" th:text="#{mail.talentPhotoRemoved.title(${talentName})}"></h1>

                                    <p class="text" style="margin:12px 0 12px 0;" th:text="#{mail.talentPhotoRemoved.intro}"></p>
                                    <p class="text" style="margin:0 0 12px 0;" th:text="#{mail.talentPhotoRemoved.reason}"></p>
                                    <p class="text" style="margin:0 0 20px 0;" th:text="#{mail.talentPhotoRemoved.accountIntact}"></p>

                                    <!-- Tips -->
                                    <table border="0" cellpadding="0" cellspacing="0" class="tips" role="presentation"
                                           style="margin:0 0 20px 0;" width="100%">
                                        <tr>
                                            <td style="padding:20px 20px 12px 20px;">
                                                <h2 class="h2" th:text="#{mail.talentPhotoRemoved.tipsTitle}"></h2>
                                                <p class="text" style="margin:8px 0 8px 0;" th:text="#{mail.talentPhotoRemoved.tipsLead}"></p>
                                                <p class="text" style="margin:0 0 4px 0;" th:text="#{mail.talentPhotoRemoved.tip1}"></p>
                                                <p class="text" style="margin:0 0 4px 0;" th:text="#{mail.talentPhotoRemoved.tip2}"></p>
                                                <p class="text" style="margin:0 0 4px 0;" th:text="#{mail.talentPhotoRemoved.tip3}"></p>
                                                <p class="text" style="margin:0 0 4px 0;" th:text="#{mail.talentPhotoRemoved.tip4}"></p>
                                                <p class="text" style="margin:0 0 8px 0;" th:text="#{mail.talentPhotoRemoved.tip5}"></p>
                                            </td>
                                        </tr>
                                    </table>

                                    <p class="text" style="margin:0 0 12px 0;" th:text="#{mail.talentPhotoRemoved.noProfessional}"></p>

                                    <!-- Fotos de ejemplo -->
                                    <th:block th:if="${examplePhotoCids != null and !examplePhotoCids.isEmpty()}">
                                        <p class="text" style="margin:0 0 12px 0;" th:text="#{mail.talentPhotoRemoved.exampleLead}"></p>
                                        <table border="0" cellpadding="0" cellspacing="0" role="presentation"
                                               style="margin:0 0 20px 0;" width="100%">
                                            <tr>
                                                <td align="center" style="padding:0 6px;" th:each="photoCid : ${examplePhotoCids}"
                                                    valign="top">
                                                    <img alt="" class="example-img" th:alt="#{mail.talentPhotoRemoved.exampleAlt}"
                                                         th:src="|cid:${photoCid}|" width="200">
                                                </td>
                                            </tr>
                                        </table>
                                    </th:block>

                                    <p class="text" style="margin:0 0 12px 0;" th:text="#{mail.talentPhotoRemoved.purpose}"></p>
                                    <p class="text" style="margin:0 0 12px 0;" th:text="#{mail.talentPhotoRemoved.criteria}"></p>
                                    <p class="text" style="margin:0 0 8px 0;" th:text="#{mail.talentPhotoRemoved.upload}"></p>

                                    <!-- Botón -->
                                    <table border="0" cellpadding="0" cellspacing="0" role="presentation"
                                           style="margin:12px 0 12px 0;"
                                           width="100%">
                                        <tr>
                                            <td align="center" style="padding:8px 0 16px 0;">
                                                <a class="btn" style="color:#ffffff !important;"
                                                   th:href="${editProfileUrl}">
                                                    <span th:text="#{mail.talentPhotoRemoved.button}"></span>
                                                </a>
                                            </td>
                                        </tr>
                                    </table>

                                    <p style="margin:0 0 8px 0; font:400 12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#6b7280;"
                                       th:text="#{mail.talentPhotoRemoved.help}"></p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center" style="padding:20px 16px 28px 16px;">
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 10px 0;">
                            <tr>
                                <td style="padding:0 6px;">
                                    <a href="https://www.instagram.com/autocasting.app/" style="text-decoration:none;">
                                        <img alt="Instagram" height="20" src="cid:autocasting-insta-icon"
                                             style="display:block;border:0;outline:0;text-decoration:none;"
                                             width="20">
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0; font:400 13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#6b7280;">
                            <a href="https://www.instagram.com/autocasting.app/" style="color:#374151;text-decoration:none;">@autocasting.app</a>
                            &nbsp;&middot;&nbsp;
                            <a href="https://autocasting.app/" style="color:#374151;text-decoration:none;">autocasting.app</a>
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
