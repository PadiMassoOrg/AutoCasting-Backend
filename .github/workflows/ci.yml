name: CI

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [main, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autocasting
          POSTGRES_PASSWORD: autocasting
          POSTGRES_DB: autocasting
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/autocasting
      DATABASE_USERNAME: autocasting
      DATABASE_PASSWORD: autocasting
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8080
      MAIL_PASS: ci-placeholder-mail-pass
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew build --no-daemon
