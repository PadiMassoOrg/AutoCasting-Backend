app = "autocasting-ar-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  JAVA_TOOL_OPTIONS = "-Xmx320m -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=64m"
  MALLOC_ARENA_MAX = "2"
  DB_POOL_MAX_SIZE = "5"
  TOMCAT_MAX_THREADS = "12"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "768mb"
